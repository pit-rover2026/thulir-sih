<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3932"/>
      <stop offset="100%" stop-color="#0F241F"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cycle Arrows Loop (Top Left) -->
  <g transform="translate(145, 140)">
    <!-- Orange clockwise arc (top right) -->
    <path d="M 0,-48 A 48 48 0 0 1 48,0" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="40,-4 58,8 54,-14" fill="#EA580C"/>
    
    <!-- Teal counter-clockwise arc (bottom left) -->
    <path d="M 0,48 A 48 48 0 0 1 -48,0" fill="none" stroke="url(#roverGrad)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="-40,4 -58,-8 -54,14" fill="#0D9488"/>
  </g>

  <!-- Terrain Slope Line -->
  <path d="M 90 310 L 190 310 C 260 310, 275 220, 395 220" fill="none" stroke="#264653" stroke-width="6" stroke-linecap="round"/>

  <!-- Flexible Transfer Hose -->
  <path d="M 195 260 C 220 260, 240 300, 275 250 C 290 225, 285 185, 305 175" fill="none" stroke="#2A9D8F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mother Tank Unit (Right, Elevated) -->
  <g transform="translate(305, 115)" filter="url(#subtleShadow)">
    <!-- Tank Cap / Top Hatch -->
    <rect x="25" y="0" width="30" height="10" rx="3" fill="#132A24"/>
    <rect x="20" y="8" width="40" height="6" rx="2" fill="#204E43"/>
    <!-- Tank Body -->
    <rect x="5" y="14" width="70" height="96" rx="14" fill="url(#tankGrad)" stroke="#2DD4BF" stroke-width="2"/>
    <!-- Coupling Port -->
    <rect x="-4" y="52" width="10" height="16" rx="3" fill="#132A24" stroke="#2DD4BF" stroke-width="1.5"/>
    <!-- Tank Level Gauge Window -->
    <line x1="16" y1="30" x2="16" y2="92" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Tracked Daughter Rover (Left, Ground Level) -->
  <g transform="translate(100, 230)" filter="url(#subtleShadow)">
    <!-- Exhaust / Antenna / Intake Arm -->
    <path d="M 22 25 L 22 8 C 22 2, 28 2, 28 8 L 28 25" fill="none" stroke="#1E3932" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Rover Cabin / Pump Housing -->
    <rect x="28" y="22" width="56" height="34" rx="7" fill="url(#roverGrad)" stroke="#1E3932" stroke-width="2"/>
    <!-- Rover Cab Window -->
    <rect x="48" y="27" width="28" height="14" rx="3" fill="#091422" opacity="0.85"/>
    <line x1="34" y1="34" x2="42" y2="34" stroke="#FFE3B3" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Heavy Duty Track Base -->
    <rect x="10" y="52" width="84" height="26" rx="13" fill="#1E3932"/>
    <rect x="14" y="55" width="76" height="20" rx="10" fill="#E76F51"/>
    <!-- 5 Track Wheels -->
    <circle cx="26" cy="65" r="4.5" fill="#1E3932"/>
    <circle cx="39" cy="65" r="4.5" fill="#1E3932"/>
    <circle cx="52" cy="65" r="4.5" fill="#1E3932"/>
    <circle cx="65" cy="65" r="4.5" fill="#1E3932"/>
    <circle cx="78" cy="65" r="4.5" fill="#1E3932"/>
  </g>

  <!-- Typography: PIT ROVER -->
  <text x="250" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="54" letter-spacing="4" text-anchor="middle" fill="#1B3030">PIT ROVER</text>
  <text x="250" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-weight="600" font-size="14" letter-spacing="3" text-anchor="middle" fill="#0D9488">SANITATION MECHATRONICS</text>
</svg>
